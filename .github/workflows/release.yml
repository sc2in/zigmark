name: Release

on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-publish to FlakeHub"
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the release-tag CHANGELOG guard can diff
          # against the previous tag.
          fetch-depth: 0

      # Authoritative backstop for the local pre-push hook (.githooks/pre-push):
      # a release tag must include a CHANGELOG.md change since the previous tag.
      # Cannot be bypassed with `git push --no-verify`.
      - name: Require CHANGELOG update for release tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          tag="${{ github.ref_name }}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "No previous tag; skipping CHANGELOG check."
            exit 0
          fi
          if git diff --quiet "$prev" "$tag" -- CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no changes between $prev and $tag. Update the changelog (e.g. 'nix run .#bump') before releasing."
            exit 1
          fi
          echo "CHANGELOG.md updated since $prev ✓"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            sandbox = false

      - name: Configure permissions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3
        with:
          use-gha-cache: "enabled"
          flakehub-flake-name: "sc2in/ZigMark"

      - name: Build
        run: nix build .#zigmark-safe -o result

      - name: Package
        run: |
          ARCHIVE="zigmark-${{ github.ref_name }}-${{ matrix.system }}.tar.gz"
          tar czf "$ARCHIVE" --dereference \
            -C result \
            bin \
            lib \
            include
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Create / update release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --draft=true
          else
            gh release create "$TAG" --repo "$REPO" --draft --generate-notes
          fi

          gh release upload "$TAG" --repo "$REPO" dist/*.tar.gz dist/checksums.txt --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false

  flakehub-publish:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin
          - os: macos-13
            system: x86_64-darwin
    runs-on: ${{ matrix.os }}
    name: flakehub-publish (${{ matrix.system }})
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3
        with:
          use-gha-cache: "disabled"
          flakehub-flake-name: "sc2in/ZigMark"

      - uses: DeterminateSystems/flakehub-push@v6
        with:
          visibility: public
          name: sc2in/ZigMark
          tag: "${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          include-output-paths: true
